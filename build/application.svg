<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Vibrant Electric Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Fine Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- Abstract Prism Geometry (Intersecting Facets) -->
  <g transform="translate(256, 256)">
    <!-- Top-Right Blade -->
    <polygon points="0,-140 120,-30 0,60" fill="url(#cyanGrad)" />

    <!-- Bottom-Left Shadow Blade -->
    <polygon points="0,140 -120,30 0,-60" fill="url(#indigoGrad)" />

    <!-- Center Overlap Core (Accent) -->
    <polygon points="0,-60 60,-5 0,60 -60,5" fill="#09090B" opacity="0.35" />

    <!-- Sharp Center Apex Light -->
    <circle cx="0" cy="0" r="12" fill="#F8FAFC" />
  </g>
</svg>
